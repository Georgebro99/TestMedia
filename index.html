<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ripplegram</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <h1 class="logo">Ripplegram</h1>
        <nav id="mainNav" class="main-nav">
          <button class="nav-btn active" data-view="home"><span>Home</span></button>
          <button class="nav-btn" data-view="search"><span>Search</span></button>
          <button class="nav-btn" data-view="reels"><span>Reels</span></button>
          <button class="nav-btn" data-view="messages"><span>Messages</span></button>
          <button class="nav-btn" data-view="profile"><span>Profile</span></button>
          <button class="nav-btn" id="newPostBtn"><span>Create</span></button>
        </nav>
        <button id="editProfileBtn" class="ghost full">Edit profile</button>
      </aside>

      <main class="content">
        <section id="homeView" class="view active-view">
          <div id="stories" class="stories"></div>
          <section id="feed" class="feed"></section>
        </section>

        <section id="searchView" class="view">
          <input id="searchInput" class="search-input" placeholder="Search people or hashtags" />
          <div id="searchGrid" class="search-grid"></div>
        </section>

        <section id="reelsView" class="view">
          <div id="reelsList" class="reels-list"></div>
        </section>

        <section id="messagesView" class="view messages-layout">
          <aside class="threads">
            <h2>Messages</h2>
            <div id="threadList"></div>
          </aside>
          <section class="chat-box">
            <div id="chatMessages" class="chat-messages"></div>
            <form id="chatForm" class="chat-form">
              <input id="chatInput" placeholder="Message..." maxlength="180" required />
              <button class="primary">Send</button>
            </form>
          </section>
        </section>

        <section id="profileView" class="view">
          <div id="profileHeader" class="profile-header"></div>
          <div class="profile-tabs">Posts</div>
          <div id="profileGrid" class="profile-grid"></div>
        </section>
      </main>

      <aside class="right-rail">
        <div id="miniProfile" class="mini-profile"></div>
        <section>
          <h3>Suggested for you</h3>
          <ul id="suggestions" class="suggestions"></ul>
        </section>
      </aside>
    </div>

    <dialog id="createDialog">
      <form id="createForm" class="dialog-card" method="dialog">
        <h2>Create post</h2>
        <textarea id="createText" maxlength="280" placeholder="Write a caption..." required></textarea>
        <input id="createImage" type="url" placeholder="Image URL (optional)" />
        <div class="dialog-actions">
          <button class="ghost" value="cancel">Cancel</button>
          <button class="primary" value="submit">Post</button>
        </div>
      </form>
    </dialog>

    <dialog id="profileDialog">
      <form id="profileForm" class="dialog-card" method="dialog">
        <h2>Edit profile</h2>
        <input id="profileNameInput" placeholder="Display name" required />
        <input id="profileHandleInput" placeholder="Username" required />
        <textarea id="profileBioInput" maxlength="120" placeholder="Bio"></textarea>
        <div class="dialog-actions">
          <button class="ghost" value="cancel">Cancel</button>
          <button class="primary" value="submit">Save</button>
        </div>
      </form>
    </dialog>

    <template id="postTemplate">
      <article class="post">
        <header>
          <button class="author-btn" data-action="open-profile">
            <div class="avatar tiny"></div>
            <div>
              <strong class="author-name"></strong>
              <small class="author-handle"></small>
            </div>
          </button>
          <small class="post-time"></small>
        </header>
        <img class="post-image" alt="Post image" />
        <p class="post-caption"></p>
        <footer>
          <button data-action="like">Like <span>0</span></button>
          <button data-action="comment">Comment <span>0</span></button>
          <button data-action="bookmark">Save <span>0</span></button>
        </footer>
        <form class="comment-form hidden">
          <input maxlength="140" placeholder="Add a comment..." />
          <button class="primary">Post</button>
        </form>
        <ul class="comments"></ul>
      </article>
    </template>

    <div id="toast" class="toast"></div>
    <script src="app.js"></script>
  </body>
</html>
